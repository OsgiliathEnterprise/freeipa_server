---
dependency:
  name: galaxy
  enabled: ${DEPENDENCY_ENABLED:-True}
  options:
    role-file: ${REQUIREMENTS_PATH:-requirements.yml}
    requirements-file: requirements-collections.yml
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: Fedora-Molecule-Volumes-KVM
    box: ${TESTBOX:-fedora/41-cloud-base}
    provider_options:
      driver: "kvm"
      cpus: 2
      memory: 2048
    provider_raw_config_args:
      - "storage :file, :size => '1G', :device => 'vdb'"
    groups:
      - ipaservers
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../community-collections:${HOME}/.ansible/collections:/usr/share/ansible/collections"
    ANSIBLE_REMOTE_TMP: /var/tmp/ansible-remote
    ANSIBLE_ASYNC_DIR: "/tmp/.ansible_async"
  options:
    vvv: True
  config_options:
    defaults:
      remote_tmp: /var/tmp/ansible-remote
      forks: 20
    ssh_connection:
      pipelining: true
      ssh_args: -o ControlMaster=auto -o ControlPersist=600s
verifier:
  name: testinfra
  env:
    PYTHONWARNINGS: "ignore:.*U.*mode is deprecated:DeprecationWarning"
  options:
    v: 1
scenario:
  name: kvm
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
