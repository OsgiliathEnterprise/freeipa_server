---

- name: Prereq | install package needed to gather ip and hostname
  ansible.builtin.package:
    name: "{{ item }}"
  with_items:
    - iproute
    - hostname
    - NetworkManager
    - systemd-resolved
  become: True

# Not a fan of ipV6, thus followed the informations here: https://www.freeipa.org/page/Deployment_Recommendations
- name: Prereq | Disables all ipv6
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.disable_ipv6
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes
  become: yes
  when:
   - ansible_facts['virtualization_type'] is not defined or ansible_facts['virtualization_type'] not in ['container']

- name: Prereq | Disables default ipv6
  ansible.posix.sysctl:
    name: net.ipv6.conf.default.disable_ipv6
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes
  become: yes
  when:
   - ansible_facts['virtualization_type'] is not defined or ansible_facts['virtualization_type'] not in ['container']

- name: Prereq | Enables ipv6 for lo
  ansible.posix.sysctl:
    name: net.ipv6.conf.lo.disable_ipv6
    value: '0'
    sysctl_set: yes
    state: present
    reload: yes
  become: yes
  when:
   - ansible_facts['virtualization_type'] is not defined or ansible_facts['virtualization_type'] not in ['container']

- name: Prereq | Start NetworkManager service
  ansible.builtin.service:
    name: NetworkManager
    enabled: True
    state: started
  become: true

- name: Prereq | Start Systemd Resolved service
  ansible.builtin.service:
    name: systemd-resolved
    enabled: True
    state: started
  become: true

- name: Prereq | reload NetworkManager to have it rely on systemd-resolved
  ansible.builtin.command:
    cmd: "nmcli general reload"
  become: true
  changed_when: false
